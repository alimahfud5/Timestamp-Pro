name: Android CI & Build APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Terbitkan GitHub Release beserta file APK'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Tag rilis (contoh: v1.0.0) jika menerbitkan GitHub Release'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Test, Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK (API 36.1)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36.1'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Prepare Debug Keystore & Env
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            tr -d '\n\r ' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload Unit Test Report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TIMESTAMP_PHOTO_PRO-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: TIMESTAMP_PHOTO_PRO-debug-apk
          path: dist/TIMESTAMP_PHOTO_PRO-debug.apk

      - name: Build Signed Release APK & AAB (if signing secrets are configured)
        id: signed_release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > my-upload-key.jks
            KEYSTORE_PATH="${{ github.workspace }}/my-upload-key.jks" gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
            cp app/build/outputs/apk/release/app-release.apk dist/TIMESTAMP_PHOTO_PRO-release.apk
            cp app/build/outputs/bundle/release/app-release.aab dist/TIMESTAMP_PHOTO_PRO-release.aab
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing secrets not configured; skipping signed release build."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean Up Keystores
        if: always()
        run: rm -f my-upload-key.jks debug.keystore

      - name: Upload Signed Release Artifacts
        if: steps.signed_release.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: TIMESTAMP_PHOTO_PRO-release-artifacts
          path: |
            dist/TIMESTAMP_PHOTO_PRO-release.apk
            dist/TIMESTAMP_PHOTO_PRO-release.aab

      - name: Write Build Summary
        run: |
          {
            echo "## Build TIMESTAMP PHOTO PRO Selesai"
            echo ""
            echo "| File Output | Ukuran |"
            echo "| :--- | :--- |"
            for f in dist/*; do
              [ -f "$f" ] && echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          files: dist/*
          generate_release_notes: true
